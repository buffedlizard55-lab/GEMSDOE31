name: Verify research release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned CPU dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore small pinned template, catalogue and registered control; verify bytes and STOP
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_current_run.py --restore-small-inputs
      - name: Unit, leakage, metric, writer and regression tests
        run: python -m pytest -q
      - name: Lint and compile
        run: |
          python -m ruff check .
          python -m compileall -q src scripts tests
      - name: Independent metric proof and deterministic site build
        run: |
          python scripts/check_metric.py
          python scripts/collect_evidence.py
          python scripts/build_site.py
          python scripts/check_site.py
      - name: Keep competition inputs and regenerable caches out of Git
        run: |
          test -z "$(git ls-files .cache data work .venv)"
