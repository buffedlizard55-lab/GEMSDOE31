name: Audit and Pages

on:
  push:
    branches: [main, arena/94fc8374-gemsdoe31]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6,18 * * *'

permissions:
  contents: read

concurrency:
  group: audit-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Regressions and frozen artifact integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python scripts/verify_tgj31.py
      - run: python scripts/collect_evidence.py
      - run: python scripts/build_site.py
      - run: python scripts/update_readme.py --check
      - run: python scripts/check_site.py
      - name: Generated registers and pages must match frozen evidence
        run: git diff --exit-code -- README.md registry docs
      - name: Refresh public-source metadata only, never scientific predictions
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/refresh_source_status.py
      - name: Stage both current root and legacy /docs routes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p .cache/pages/docs
          cp -R docs/. .cache/pages/
          cp -R docs/. .cache/pages/docs/
      - name: Upload Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .cache/pages

  deploy:
    name: Publish audited site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
